name: Windows EXE signing verification
on:
  push:
    branches: [main]
    paths:
      - 'build_windows.py'
      - 'sign_release.ps1'
      - 'capture_signing.py'
      - 'SOURCE_AUDIT.json'
      - '.github/workflows/windows-build-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-signing:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
      - name: Install Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Verify Windows build toolchain
        shell: pwsh
        run: |
          python -c "import sys,struct; print(sys.version); assert sys.version_info[:2]==(3,12) and struct.calcsize('P')==8"
          $ErrorActionPreference = 'Stop'
          Get-Command certreq.exe,certutil.exe | Format-Table Name,Source
      - name: Seed two old Sunrise Group certificates to exercise duplicate-subject safety
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "from pathlib import Path;import json;import capture_signing as c;p=Path.cwd(); a=p/'Windows_결과';a.mkdir(exist_ok=True); prior=[c._create_certificate(c._find_program('certreq.exe'),c._find_program('certutil.exe'),a,p)[1] for _ in range(2)];(a/'CI_PRIOR_CERTIFICATES.json').write_text(json.dumps(prior));print('Seeded old certificate count:',len(prior))"
          if ($LASTEXITCODE -ne 0) { throw 'Certificate seeding failed' }
      - name: Build, ALWAYS create new cert, sign and package
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:SUNRISE_TIMESTAMP_URL -ErrorAction SilentlyContinue
          python -u build_windows.py --profile RELEASE_MIN
          if ($LASTEXITCODE -ne 0) { throw "RELEASE_MIN returned $LASTEXITCODE" }
      - name: Verify signed bytes and group ZIP layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Get-Content -Raw 'Windows_결과/WINDOWS_BUILD_RESULT.json' | ConvertFrom-Json
          $sig = Get-Content -Raw 'Windows_결과/WINDOWS_SIGNING_RESULT.json' | ConvertFrom-Json
          if ($build.status -ne 'PASS' -or $sig.signer_subject -ne 'CN=Sunrise Group') { throw 'Unsigned or invalid build result' }
          $exe = 'dist/SunriseImage/SunriseImage.exe'
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash
          if ($actual -ne $build.executable_sha256 -or $actual -ne $sig.executable_sha256_after_signing) { throw 'Signed hash mismatch' }
          if (-not (Test-Path 'Windows_결과/SunriseGroup_SelfSigned_CodeSigning.cer')) { throw 'New public certificate missing' }
          $previous = Get-Content -Raw 'Windows_결과/CI_PRIOR_CERTIFICATES.json' | ConvertFrom-Json
          if ($sig.signer_thumbprint -in $previous) { throw 'Signer reused an old certificate' }
          if (-not $sig.certificate_created -or $sig.certificate_selection_policy -ne 'ALWAYS_NEW_PER_SIGNING') { throw 'Fresh certificate gate failed' }
          $zpath = 'release/Sunrise_Image.zip'
          if (-not (Test-Path $zpath)) { throw 'Missing output ZIP' }
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zpath).Path)
          try {
            $names = $z.Entries.FullName
            if ('Sunrise Group/Sunrise Image/SunriseImage.exe' -notin $names) { throw 'Missing group-layout executable' }
          } finally { $z.Dispose() }
          Write-Output ('Windows new-cert-per-build signed EXE and ZIP PASS; SHA256=' + $actual)
      - name: Verify Korean certificate SHA1 and certreq NEW CERTIFICATE REQUEST PEM (no recompilation)
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          from pathlib import Path
          import capture_signing as signer
          result = json.loads(Path('Windows_결과/WINDOWS_SIGNING_RESULT.json').read_text('utf-8'))
          cert = Path('Windows_결과/cert_provisioning/SunriseGroup_SelfSigned_CodeSigning.cer')
          raw = cert.read_bytes()
          if not raw.startswith((b'-----BEGIN NEW CERTIFICATE REQUEST-----', b'-----BEGIN CERTIFICATE-----', b'0')):
              raise RuntimeError('Unexpected certreq certificate file container')
          korean = '인증서 해시(sha1): ' + result['signer_thumbprint'].lower()
          thumb = signer._fresh_certificate_thumbprint(cert, korean)
          if thumb != result['signer_thumbprint']:
              raise RuntimeError('Korean localized SHA1 or NEW PEM header did not match newly signed EXE')
          print('PASS: Korean SHA1 label, certreq PEM certificate, fresh SHA1 fingerprint == SignTool signer')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Korean certificate parsing regression failed' }
      - name: Reproduce Korean-path CP949 signer against existing built EXE (no recompilation)
        shell: pwsh
        env:
          PYTHONIOENCODING: 'cp949'
          PYTHONUTF8: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:SUNRISE_TIMESTAMP_URL -ErrorAction SilentlyContinue
          $korean = Join-Path $env:RUNNER_TEMP '0_테스트'
          New-Item -ItemType Directory -Force $korean | Out-Null
          $exe = Join-Path $korean 'SunriseImage.exe'
          Copy-Item 'dist/SunriseImage/SunriseImage.exe' $exe
          $audit = Join-Path $korean 'Windows_결과'
          New-Item -ItemType Directory -Force $audit | Out-Null
          $report = Join-Path $audit 'WINDOWS_SIGNING_RESULT.json'
          python -S capture_signing.py --executable $exe --audit-dir $audit --report $report
          if ($LASTEXITCODE -ne 0) { throw 'Korean-path CP949 signing failed' }
          $sig = Get-Content -Raw $report | ConvertFrom-Json
          $real = (Get-FileHash -Algorithm SHA256 $exe).Hash
          if ($sig.executable_sha256_after_signing -ne $real) { throw 'CP949 signer produced incorrect EXE hash' }
          if ($sig.certificate_selection_policy -ne 'ALWAYS_NEW_PER_SIGNING') { throw 'Old cert was reused' }
          Write-Output 'PASS: Korean path, CP949 redirected output, fresh certificate, SignTool, signed EXE SHA256'
      - name: Write sanitized verification summary
        if: always()
        shell: pwsh
        run: |
          $result = 'Windows_결과/WINDOWS_BUILD_RESULT.json'
          if (Test-Path $result) { Get-Content -Raw $result | Write-Output }
          # No private keys, PFX, binaries or generated release ZIP uploaded to GitHub.
